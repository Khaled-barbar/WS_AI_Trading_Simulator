<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agents Lab</title>
<style>
:root{
  --bg:#f6f7f9;--panel:#fff;--ink:#1b1f24;--muted:#5f6b7a;--line:#e3e6ea;
  --accent:#2f6fde;--good:#1f8a4c;--bad:#c2410c;--warn:#b7791f;--chip:#eef2f7;
  --gemini:#2f6fde;--chatgpt:#10a37f;--claude:#c96442;--consensus:#6b5bd2;--grid:#eceff3;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#111418;--panel:#1a1f25;--ink:#e6e9ed;--muted:#97a3b2;--line:#2b323b;
  --accent:#6ea0ff;--good:#4ccb83;--bad:#ff8a5c;--warn:#e7b65a;--chip:#232a33;
  --gemini:#6ea0ff;--chatgpt:#3fcf9f;--claude:#e58a66;--consensus:#a495ff;--grid:#252b33;}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,"Segoe UI",Tahoma,sans-serif}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:6}
header h1{font-size:18px;margin:0}
header .sp{flex:1}
#ver{font-size:12px}
nav{display:flex;gap:4px;flex-wrap:wrap;padding:8px 20px;background:var(--panel);border-bottom:1px solid var(--line)}
nav button{border:0;background:none;color:var(--muted);padding:7px 12px;border-radius:8px;cursor:pointer;font:inherit}
nav button.on{background:var(--chip);color:var(--ink);font-weight:600}
nav#menu button{font-size:15.5px;font-weight:600}
nav#menu button.on{background:var(--accent);color:#fff}
nav#sub{padding:6px 20px}
nav#items{padding:6px 20px;gap:6px;max-height:120px;overflow:auto}
nav#items button{border:1px solid var(--line);font-size:13px;padding:4px 10px}
nav#items button.on{border-color:var(--accent)}
nav:empty{display:none}
main{padding:20px;max-width:1360px;margin:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.card h3{margin:0 0 8px;font-size:15px}
.kpi .v{font-size:22px;font-weight:700}.kpi .l{color:var(--muted);font-size:13px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:13px}
th.sort{cursor:pointer;white-space:nowrap}th.sort:hover{color:var(--ink)}
.ltr{direction:ltr;unicode-bidi:isolate}
/* LTR values (numbers, tickers, dates) inside an RTL table must still follow the column's side */
html[dir=rtl] td.ltr,html[dir=rtl] .kpi .v.ltr{text-align:right}
.tablewrap{overflow-x:auto}
.chip{display:inline-block;padding:1px 8px;border-radius:99px;background:var(--chip);font-size:12px;white-space:nowrap}
.chip.warnc{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.chip.goodc{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}.muted{color:var(--muted)}
.agent{font-weight:600}.a-gemini{color:var(--gemini)}.a-chatgpt{color:var(--chatgpt)}.a-claude{color:var(--claude)}.a-consensus{color:var(--consensus)}
button.btn{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:7px 13px;cursor:pointer;font:inherit}
button.btn.sec{background:var(--chip);color:var(--ink)}
button.btn.sm{padding:3px 9px;font-size:13px}
button.btn.danger{background:var(--bad)}
button.btn:disabled{opacity:.5;cursor:default}
button.link{background:none;border:0;color:var(--accent);cursor:pointer;font:inherit;padding:0;text-align:start}
select,textarea,input{font:inherit;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
input[type=number]{width:110px}
textarea{width:100%;min-height:200px;direction:ltr;font-family:ui-monospace,Consolas,monospace;font-size:13px}
pre{white-space:pre-wrap;direction:ltr;text-align:left;background:var(--chip);padding:12px;border-radius:8px;font-size:12.5px;max-height:520px;overflow:auto;margin:0}
.bar{height:8px;background:var(--chip);border-radius:4px;overflow:hidden;min-width:70px}
.bar>i{display:block;height:100%;background:var(--accent)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.agents{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
details summary{cursor:pointer;color:var(--muted)}
.md h1{font-size:20px}.md h2{font-size:16px;margin-top:22px}
.md blockquote{margin:8px 0;padding:6px 12px;border-inline-start:3px solid var(--warn);color:var(--muted)}
.note{border-inline-start:3px solid var(--warn);padding:8px 12px;background:var(--panel);border-radius:8px;margin-bottom:14px;color:var(--muted);font-size:14px}
svg.spark{display:block}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--panel);color:var(--muted);padding:5px 10px;cursor:pointer;font:inherit;font-size:13px}
.seg button.on{background:var(--accent);color:#fff}
.chartbox{position:relative;direction:ltr}
.chartbox svg{display:block;width:100%;height:auto}
.chartbox text{font-size:11px;fill:var(--muted)}
.tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.12);display:none;white-space:nowrap;z-index:4}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12.5px;margin-top:6px;direction:ltr;justify-content:flex-start}
.legend span{display:inline-flex;align-items:center;gap:5px}.legend i{width:14px;height:3px;border-radius:2px;display:inline-block}
.ac{position:relative;display:inline-block}
.ac .list{position:absolute;top:100%;inset-inline-start:0;z-index:8;background:var(--panel);border:1px solid var(--line);border-radius:8px;min-width:340px;max-height:300px;overflow:auto;box-shadow:0 6px 18px rgba(0,0,0,.15)}
.ac .list div{padding:6px 10px;cursor:pointer;font-size:13.5px;border-bottom:1px solid var(--line)}
.ac .list div:hover{background:var(--chip)}
.formgrid{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.formgrid label{display:flex;flex-direction:column;font-size:12.5px;color:var(--muted);gap:3px}
.hl{background:color-mix(in srgb,var(--accent) 7%,transparent)}
@media (max-width:600px){main{padding:12px}.agents{grid-template-columns:1fr}header{padding:10px 12px}nav{padding:6px 12px}}
</style>
</head>
<body>

  <button class="btn" id="runbtn"></button>
  <button class="btn sec" id="refresh"></button>
  <button class="btn sec" id="updbtn"></button>
  <button class="btn sec" id="langbtn" title="Language / اللغة"></button>

<nav id="sub"></nav>
<nav id="items"></nav>
<main id="view"></main>

/* ---------- line chart (SVG, no libraries) ---------- */
const PALETTE=["#2f6fde","#c96442","#10a37f","#8a5cd6","#d4a017","#e0457b","#1fa2b8","#6b8e23","#ff7f0e","#7f7f7f","#9467bd","#17becf"];
const CHARTS={};let chartSeq=0;
function lineChart(lines,{h=280,mode="pct",money=false}={}){
  // lines: [{name,color,pts:[[date,value]],dash,width}]; mode "pct": each line as cumulative return from its first point
  lines=lines.filter(l=>l.pts&&l.pts.length>1);
  if(!lines.length)return `<p class="muted">${T("no_data")}</p>`;
  const id="ch"+(++chartSeq),W=920,H=h,L=58,R=14,Tp=12,B=26;
  const data=lines.map(l=>{const b=l.pts[0][1];return{...l,xs:l.pts.map(p=>+new Date(p[0])),ys:l.pts.map(p=>mode==="pct"?p[1]/b-1:p[1])}});
  let x0=Math.min(...data.map(d=>d.xs[0])),x1=Math.max(...data.map(d=>d.xs[d.xs.length-1]));
  let y0=Math.min(...data.map(d=>Math.min(...d.ys))),y1=Math.max(...data.map(d=>Math.max(...d.ys)));
  if(mode==="pct"){y0=Math.min(y0,0);y1=Math.max(y1,0)}
  if(y1===y0){y1+=1;y0-=1}const pad=(y1-y0)*.06;y0-=pad;y1+=pad;if(x1===x0)x1+=864e5;
  const X=x=>L+(x-x0)/(x1-x0)*(W-L-R),Y=y=>Tp+(1-(y-y0)/(y1-y0))*(H-Tp-B);
  const step=(()=>{const r=(y1-y0)/5,m=Math.pow(10,Math.floor(Math.log10(r)));return [1,2,2.5,5,10].map(k=>k*m).find(k=>k>=r)})();
  let g="";for(let v=Math.ceil(y0/step)*step;v<=y1;v+=step){const y=Y(v);
    g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--grid)" ${Math.abs(v)<step/1e6?'stroke="var(--muted)" stroke-dasharray="3 3"':""}/><text x="${L-6}" y="${y+4}" text-anchor="end">${mode==="pct"?(v*100).toFixed(Math.abs(step)<0.01?1:0)+"%":num(v,0)}</text>`}
  const span=(x1-x0)/864e5,xt=[];const d0=new Date(x0);
  if(span>900){for(let y=d0.getFullYear()+1;+new Date(y,0,1)<=x1;y++)xt.push([+new Date(y,0,1),String(y)])}
  else{const stepM=span>400?3:span>120?1:0;if(stepM){let d=new Date(d0.getFullYear(),d0.getMonth()+1,1);while(+d<=x1){xt.push([+d,d.toISOString().slice(0,7)]);d=new Date(d.getFullYear(),d.getMonth()+stepM,1)}}
    else{for(let t=x0;t<=x1;t+=Math.max(1,Math.round(span/6))*864e5)xt.push([t,new Date(t).toISOString().slice(5,10)])}}
  const thin=xt.length>12?xt.filter((_,i)=>i%Math.ceil(xt.length/12)===0):xt;
  g+=thin.map(([t,s])=>`<line x1="${X(t)}" x2="${X(t)}" y1="${Tp}" y2="${H-B}" stroke="var(--grid)"/><text x="${X(t)}" y="${H-8}" text-anchor="middle">${s}</text>`).join("");
  const paths=data.map((d,i)=>{const c=d.color||PALETTE[i%PALETTE.length];d.c=c;
    return `<polyline fill="none" stroke="${c}" stroke-width="${d.width||1.8}" ${d.dash?'stroke-dasharray="5 4"':""} points="${d.xs.map((x,k)=>X(x).toFixed(1)+","+Y(d.ys[k]).toFixed(1)).join(" ")}"/>`}).join("");
  CHARTS[id]={data,X,Y,x0,x1,L,R,W,H,Tp,B,mode,money};
  const legend=data.map(d=>`<span><i style="background:${d.c}"></i>${esc(d.name)}</span>`).join("");
  return `<div class="chartbox" id="${id}"><svg viewBox="0 0 ${W} ${H}" onmousemove="chartHover(event,'${id}')" onmouseleave="chartOut('${id}')">${g}${paths}<line class="cur" x1="0" x2="0" y1="${Tp}" y2="${H-B}" stroke="var(--muted)" visibility="hidden"/></svg><div class="tip"></div><div class="legend">${legend}</div></div>`;
}
function chartHover(ev,id){const c=CHARTS[id];if(!c)return;const box=document.getElementById(id),svg=box.querySelector("svg"),r=svg.getBoundingClientRect();
  const sx=(ev.clientX-r.left)/r.width*c.W;const t=c.x0+(sx-c.L)/(c.W-c.L-c.R)*(c.x1-c.x0);
  const rows=c.data.map(d=>{let lo=0,hi=d.xs.length-1;if(t<d.xs[0]||t>d.xs[hi]+5*864e5)return null;while(lo<hi){const m=(lo+hi+1)>>1;if(d.xs[m]<=t)lo=m;else hi=m-1}
    return [d,lo]}).filter(Boolean);
  if(!rows.length)return chartOut(id);
  const ln=svg.querySelector(".cur");ln.setAttribute("x1",sx);ln.setAttribute("x2",sx);ln.setAttribute("visibility","visible");
  const tip=box.querySelector(".tip");tip.style.display="block";
  tip.innerHTML=`<b>${new Date(rows[0][0].xs[rows[0][1]]).toISOString().slice(0,10)}</b><br>`+rows.sort((a,b)=>b[0].ys[b[1]]-a[0].ys[a[1]]).map(([d,k])=>`<span style="color:${d.c}">■</span> ${esc(d.name)}: <b>${c.mode==="pct"?pct(d.ys[k]):NF.format(d.ys[k])}</b>`).join("<br>");
  const px=(ev.clientX-r.left);tip.style.left=(px>r.width/2?px-tip.offsetWidth-12:px+12)+"px";tip.style.top="10px";}
function chartOut(id){const box=document.getElementById(id);if(!box)return;box.querySelector(".tip").style.display="none";box.querySelector(".cur").setAttribute("visibility","hidden")}
function spark(pts,w=140,h=30){if(!pts||pts.length<2)return"";const v=pts.map(p=>p[1]),mn=Math.min(...v),mx=Math.max(...v);
  const d=v.map((y,i)=>`${(i/(v.length-1)*w).toFixed(1)},${(h-(y-mn)/((mx-mn)||1)*h).toFixed(1)}`).join(" ");
  return `<svg class="spark" width="${w}" height="${h}"><polyline fill="none" stroke="${v[v.length-1]>=v[0]?"var(--good)":"var(--bad)"}" stroke-width="1.5" points="${d}"/></svg>`}

/* ---------- period selector ---------- */
function periodRange(p,follow){
  const today=CFG.today,t=new Date(today),iso=d=>d.toISOString().slice(0,10),back=n=>iso(new Date(+t-n*864e5));
  switch(p.preset){case "follow":return [follow||today,today];case "ytd":return [today.slice(0,4)+"-01-01",today];
    case "1m":return [back(31),today];case "3m":return [back(92),today];case "1y":return [back(365),today];case "3y":return [back(1096),today];
    case "5y":return [back(1826),today];case "10y":return [back(3652),today];case "max":return ["2016-01-04",today];
    case "custom":return [`${p.from}-01-01`,`${p.to}-12-31`<today?`${p.to}-12-31`:today];}
  return [back(1826),today];
}
function periodBar(key,p,presets,onchange){
  const years=[];for(let y=2016;y<=+CFG.today.slice(0,4);y++)years.push(y);
  const html=`<span class="muted">${T("period")}</span><span class="seg" id="${key}-seg">${presets.map(x=>`<button data-p="${x}" class="${p.preset===x?"on":""}">${T("p_"+x)}</button>`).join("")}</span>
   <span id="${key}-cust" style="display:${p.preset==="custom"?"inline-flex":"none"};gap:6px;align-items:center">
   <select id="${key}-from">${years.map(y=>`<option ${y==p.from?"selected":""}>${y}</option>`).join("")}</select>→
   <select id="${key}-to">${years.map(y=>`<option ${y==p.to?"selected":""}>${y}</option>`).join("")}</select></span>`;
  setTimeout(()=>{document.querySelectorAll(`#${key}-seg button`).forEach(b=>b.onclick=()=>{p.preset=b.dataset.p;onchange()});
    const f=$(`#${key}-from`),t=$(`#${key}-to`);if(f){f.onchange=()=>{p.from=+f.value;if(p.to<p.from)p.to=p.from;onchange()};t.onchange=()=>{p.to=+t.value;if(p.to<p.from)p.from=p.to;onchange()}}},0);
  return html;
}

  const ret=(pts,days)=>{if(pts.length<2)return null;const last=pts[pts.length-1];const t=new Date(last[0])-days*864e5;
    const base=pts.find(p=>new Date(p[0])>=t);return base?last[1]/base[1]-1:null};
  const sp=pts=>{if(pts.length<2)return"";const v=pts.slice(-180).map(p=>p[1]),mn=Math.min(...v),mx=Math.max(...v),w=160,h=34;
    const d=v.map((y,i)=>`${(i/(v.length-1)*w).toFixed(1)},${(h-(y-mn)/((mx-mn)||1)*h).toFixed(1)}`).join(" ");
    return `<svg class="spark" width="${w}" height="${h}"><polyline fill="none" stroke="var(--accent)" stroke-width="1.5" points="${d}"/></svg>`};
  const core=CFG.core_forecasts.map(c=>`<li><span class="ltr">${esc(q(c))}</span> — ${c.horizon_days} ${T("days")}</li>`).join("");

const SEARCH_CB={};
function bindSearch(id){const inp=$("#"+id),lst=$("#"+id+"-l");let tm=null,seq=0;
  inp.oninput=()=>{clearTimeout(tm);const qv=inp.value.trim();if(qv.length<1){lst.style.display="none";return}
    tm=setTimeout(async()=>{const my=++seq;let r=[];try{r=await api("/api/search?q="+encodeURIComponent(qv))}catch(e){}
      if(my!==seq)return;
      lst.innerHTML=r.map(x=>`<div data-t="${esc(x.ticker)}"><b class="ltr">${esc(x.ticker)}</b> — ${esc(x.name)} <span class="muted">${esc(x.exchange)} · ${esc(x.type||"")}</span></div>`).join("")||`<div class="muted">—</div>`;
      lst.style.display="block";lst.querySelectorAll("[data-t]").forEach(d=>d.onmousedown=e=>{e.preventDefault();inp.value=d.dataset.t;lst.style.display="none";SEARCH_CB[id](d.dataset.t)})},300)};
  inp.onblur=()=>setTimeout(()=>lst.style.display="none",150);

    if(cash)b.amount=+val;else{b.ticker=$("#txs").value.trim().toUpperCase();if(mode==="amt")b.amount=+val;else b.quantity=+val;if($("#txp").value)b.price=+$("#txp").value}
    $("#txgo").disabled=true;$("#txm").innerHTML=`<span class="muted">${T("loading")}</span>`;
    const r=await post("/api/portfolio/tx",b);$("#txgo").disabled=false;
    if(r.error){$("#txm").innerHTML=`<span class="bad">${esc(r.error)}</span>`;return}PF_LIST=null;render()};
  document.querySelectorAll("[data-dtx]").forEach(b=>b.onclick=async()=>{if(!confirm(T("confirm_del_tx")))return;await post("/api/portfolio/tx/delete",{id:+b.dataset.dtx});render()});
  $("#epgo").onclick=async()=>{const r=await post("/api/portfolio/update",{id:pid,name:$("#eps").value,benchmark:$("#epb").value,fx_fee:+$("#epf").value});
    if(r.error){$("#epm").innerHTML=`<span class="bad">${esc(r.error)}</span>`;return}PF_LIST=null;render()};
  $("#epdel").onclick=async()=>{if(!confirm(T("confirm_del_pf",p.name)))return;await post("/api/portfolio/delete",{id:pid});PF_LIST=null;go("pf","all")};
  sync();
};

/* --- system --- */
VIEWS["sys.inbox"]=async v=>{
  const b=await api("/api/inbox");
  const ma=Object.keys(CFG.agents).filter(a=>CFG.agents[a].provider==="manual");
  const list=(arr,err)=>arr.length?`<table>${arr.map(f=>`<tr><td class="ltr">${esc(f.name)}</td><td class="ltr muted">${esc(f.modified)}</td>${err?`<td class="bad ltr">${esc(f.error||"")}</td>`:""}</tr>`).join("")}</table>`:`<p class="muted">${T("empty")}</p>`;
  v.innerHTML=`<div class="card"><h3>${T("paste_title")}</h3>
   <p class="muted">${T("paste_help",ma.map(a=>label(a)).join(" / "))}</p>
   <div class="row"><select id="pa">${ma.map(a=>`<option value="${esc(a)}">${esc(label(a))}</option>`).join("")}</select>
   <select id="ptr">${CFG.tracks.map(t=>`<option value="${t}">${T("track_"+t)}</option>`).join("")}</select>
   <button class="btn" id="psave">${T("save_import")}</button><span id="pmsg"></span></div>
   <textarea id="ptext" placeholder="${esc(T("paste_ph"))}"></textarea></div>
   <div class="card"><h3>${T("waiting")}</h3>${list(b.pending)}</div>
   <div class="card"><h3>${T("import_failed")}</h3>${list(b.failed,true)}<p class="muted">${T("failed_help")}</p></div>
   <div class="card"><h3>${T("processed")}</h3>${list(b.processed)}</div>
   <p class="muted ltr" style="text-align:left">${esc(CFG.inbox)}</p>`;
  $("#psave").onclick=async()=>{$("#psave").disabled=true;
    const r=await post("/api/paste",{agent:$("#pa").value,track:$("#ptr").value,text:$("#ptext").value});
    $("#pmsg").innerHTML=r.error?`<span class="bad">${esc(r.error)}</span>`:`<span class="good ltr" style="white-space:pre-line">${esc((r.log||[]).join("\n"))}</span>`;
    $("#psave").disabled=false;if(!r.error){$("#ptext").value="";PICKS=null;setTimeout(()=>{if(R.s==="inbox")render()},4000)}};
};
VIEWS["sys.prompts"]=async v=>{
  const p=await api("/api/prompts");
  v.innerHTML=`<div class="card"><p>${T("prompts_help1")}</p><p class="muted">${T("prompts_help2")}</p></div>`+
   Object.keys(p).map(t=>`<h3>${T("prompts_"+t)}</h3>`+Object.keys(p[t]).map(a=>{const k=t+"-"+a;return `<div class="card"><div class="row"><h3 style="margin:0">${ag(a)}</h3><span class="chip">${T("track_"+t)}</span><button class="btn sec" data-c="${esc(k)}">${T("copy")}</button><span class="muted" id="c-${esc(k)}"></span></div><details><summary>…</summary><pre id="p-${esc(k)}">${esc(p[t][a])}</pre></details></div>`}).join("")).join("");
  document.querySelectorAll("[data-c]").forEach(b=>b.onclick=async()=>{const k=b.dataset.c,[t,a]=k.split("-");
    try{await navigator.clipboard.writeText(p[t][a]);$("#c-"+k).textContent=T("copied")}catch(e){
      const pre=$("#p-"+k);pre.closest("details").open=true;const r=document.createRange();r.selectNodeContents(pre);getSelection().removeAllRanges();getSelection().addRange(r);$("#c-"+k).textContent=T("selected")}});
};
VIEWS["sys.report"]=async v=>{const r=await api("/api/report");v.innerHTML=`<div class="card md ltr" style="text-align:left">${md(r.markdown)}</div>`};
VIEWS["sys.log"]=async v=>{const l=await api("/api/log");
  v.innerHTML=`<div class="card"><h3>${T("log_title")}</h3><pre id="logpre">${esc(l.text||T("no_log"))}</pre></div>`;const p=$("#logpre");p.scrollTop=p.scrollHeight};

function md(src){
  const inl=s=>esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`(.+?)`/g,"<code>$1</code>");
  const out=[];const L=src.split("\n");
  for(let i=0;i<L.length;i++){const l=L[i];
    if(l.startsWith("|")){const rows=[];while(i<L.length&&L[i].startsWith("|")){rows.push(L[i]);i++}i--;
      const cells=r=>r.split("|").slice(1,-1).map(c=>c.trim());
      out.push(`<div class="tablewrap"><table><tr>${cells(rows[0]).map(c=>`<th>${inl(c)}</th>`).join("")}</tr>${rows.slice(2).map(r=>`<tr>${cells(r).map(c=>`<td>${inl(c)}</td>`).join("")}</tr>`).join("")}</table></div>`);}
    else if(l.startsWith("## "))out.push(`<h2>${inl(l.slice(3))}</h2>`);
    else if(l.startsWith("# "))out.push(`<h1>${inl(l.slice(2))}</h1>`);
    else if(l.startsWith("> "))out.push(`<blockquote>${inl(l.slice(2))}</blockquote>`);
    else if(l.startsWith("- "))out.push(`<div>• ${inl(l.slice(2))}</div>`);
    else if(l.trim())out.push(`<p>${inl(l)}</p>`);}
  return out.join("");
}

/* ---------- header: run / language / updates ---------- */
function applyLang(){
  document.documentElement.lang=LANG;
  document.documentElement.dir=LANG==="ar"?"rtl":"ltr";
  $("#title").textContent=T("title");
  $("#runbtn").textContent=T("run");
  $("#refresh").textContent=T("refresh");
  $("#langbtn").textContent=T("switch_to");
  $("#updbtn").textContent=T("check_updates");
  $("#ver").textContent=CFG&&CFG.version?T("version",CFG.version):"";
  if(lastRun)runstate(lastRun);
}
$("#langbtn").onclick=()=>{LANG=LANG==="ar"?"en":"ar";try{localStorage.setItem("lang",LANG)}catch(e){}applyLang();if(CFG)render()};
function runstate(r){
  lastRun=r;
  $("#runbtn").disabled=r.running;
  $("#runstate").innerHTML=r.running?`<span class="warn">${T("running_since",esc((s=>s.length>8?s.slice(11,19):s)(r.started||"")))}</span>`:
    r.finished?`${T("last_run",esc(r.finished.replace("T"," ")))} ${r.code===0?`<span class="good">✓</span>`:`<span class="bad">${T("see_log")}</span>`}`:"";
}
$("#runbtn").onclick=async()=>{await post("/api/run");runstate({running:true,started:new Date().toTimeString().slice(0,8)});poll()};
$("#refresh").onclick=()=>{INV_LIST=PF_LIST=PICKS=null;render()};
$("#updbtn").onclick=checkUpdate;
async function checkUpdate(){
  const u=$("#updstate");u.innerHTML=`<span class="muted">${T("checking")}</span>`;
  let r;try{r=await api("/api/update/check")}catch(e){r={error:String(e)}}
  if(r.error){u.innerHTML=`<span class="bad">${esc(r.error)}</span>`;return}
  if(!r.newer){u.innerHTML=`<span class="good">${T("up_to_date",esc(r.installed))}</span>`;return}
  u.innerHTML=`<span class="warn">${T("update_avail",esc(r.installed),esc(r.latest))}</span> <button class="btn" id="updgo">${T("install_update",esc(r.latest))}</button>`;
  $("#updgo").onclick=()=>installUpdate(r);
}
async function installUpdate(r){
  if(!confirm(T("confirm_update",r.latest)))return;
  const u=$("#updstate");u.innerHTML=`<span class="warn">${T("updating")}</span>`;
  $("#updbtn").disabled=$("#runbtn").disabled=true;
  let res;try{res=await post("/api/update/install")}catch(e){res={error:String(e)}}
  if(res.error||!res.started){u.innerHTML=`<span class="bad">${esc(res.error||res.reason)}</span>`;$("#updbtn").disabled=false;return}
  const t0=Date.now();let down=false;
  const tick=async()=>{let c=null;try{c=await api("/api/config")}catch(e){down=true}
    if(c&&c.version===r.latest){u.innerHTML=`<span class="good">${T("updated",esc(c.version))}</span>`;setTimeout(()=>location.reload(),1500);return}
    if((c&&down)||Date.now()-t0>240000){let l={text:""};try{l=await api("/api/update/log")}catch(e){}
      u.innerHTML=`<span class="bad">${T("update_failed")}</span> <details style="display:inline-block"><summary>${T("update_log")}</summary><pre style="position:absolute;max-width:90vw;z-index:9">${esc(l.text)}</pre></details>`;
      $("#updbtn").disabled=false;return}
    setTimeout(tick,2000)};
  setTimeout(tick,2000);
}
async function poll(){const o=await api("/api/overview");runstate(o.run);
  if(o.run.running)setTimeout(poll,3000);else{INV_LIST=PF_LIST=PICKS=null;render()}}
setInterval(()=>{const k=R.m+"."+R.s;if(["lab.overview","sys.log","sys.inbox"].includes(k))render()},30000);
window.addEventListener("hashchange",()=>{parseHash();render()});

applyLang();
parseHash();
api("/api/config").then(async c=>{CFG=c;applyLang();if(!MENUS[R.m])R={m:"lab",s:"overview",i:null};
  const o=await api("/api/overview");runstate(o.run);go(R.m,R.s,R.i)});
</script>
